# CI: install, lint, typecheck, build, unit, and e2e gates run sequentially on
# every PR and push to main. Job names are contractual once branch protection
# references them. Each job provisions the local @bymax-one/nest-queue library via
# the shared ./.github/actions/setup composite (checked out beside the workspace and
# built) because the apps consume it through a `file:` link until it is published.
# The e2e job runs against a redis:7 service container strictly after unit, never
# in parallel with it, so the two suites never contend for the runner at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run TypeScript
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    env:
      # Each package's jest/vitest config reloads the locally-linked
      # @bymax-one/nest-queue per worker; a bounded heap plus `--workspace-concurrency=1`
      # (below) keeps peak memory predictable on the runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: pnpm -r --workspace-concurrency=1 run --if-present test:cov

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Run e2e tests
        run: pnpm --filter @nest-queue-example/api test:e2e
