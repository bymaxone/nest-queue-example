# CodeQL static analysis for JavaScript/TypeScript. Guarded by a visibility check
# so it runs only once the repository is public: while private it reports as
# skipped, not failed, and activates automatically on the visibility flip with
# zero workflow edits.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday 03:00 UTC, to catch newly published CVEs.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: '/language:javascript-typescript'
