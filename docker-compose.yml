# Local infrastructure for nest-queue-example. Redis is the only external
# service the example needs: BullMQ (via @bymax-one/nest-queue) uses it for
# every queue, worker, flow, scheduler and metrics operation.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
